name: Verify regenerations

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dashboard-runtime:
    runs-on: ubuntu-latest
    env:
      POKEMON_GO_DATA_TOKEN: ${{ secrets.POKEMON_GO_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Vérifier version et changelog quand une release est requise
        env:
          RELEASE_GUARD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run verify:release-change
      - run: npm run test:version
      - name: Vérifier le runtime complet avec PokemonGo-Data privé
        if: ${{ env.POKEMON_GO_DATA_TOKEN != '' }}
        run: npm run verify:regenerations && npm run test:source-watch
      - name: Vérifier le Dashboard sans accès inter-dépôt
        if: ${{ env.POKEMON_GO_DATA_TOKEN == '' }}
        run: >-
          npm run test:regeneration-notifications &&
          npm run test:regeneration-matrix &&
          node --no-warnings --experimental-strip-types --test scripts/test-source-watch-presentation.mts &&
          npm run test:pokemon-presentation &&
          npm run test:design-system &&
          npm run test:docs &&
          npm run typecheck &&
          npm run lint
